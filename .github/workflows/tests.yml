# Runs the whole test-suite on every push and pull request. (Written for GitHub Actions; not run from the authoring environment.)
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # the JS client test uses Node's built-in WebSocket
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
